[project]
name = "docassist"
version = "0.1.0"
description = "Permission-aware RAG assistant, evaluation release gate and guarded SQL agent (synthetic data only)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
docassist = "docassist.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (docker compose up -d postgres)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["docassist"]
